plugins {
	id 'fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

// 仓库统一在 settings.gradle 的 dependencyResolutionManagement 中配置

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// Cloth Config API —— 配置界面生成库（仅编译时使用）
	modCompileOnly files('libs/cloth-config.jar')

	// Trinkets —— 饰品栏 API（打进jar里，开箱即用）
	modImplementation files('libs/trinkets.jar')
	modImplementation files('libs/cardinal-components-base-5.2.0.jar')
	modImplementation files('libs/cardinal-components-entity-5.2.0.jar')

	// Mod Menu —— 模组列表菜单（仅编译时使用）
	modCompileOnly files('libs/modmenu.jar')
}

// 可选集成代码（Cloth Config + Trinkets + Mod Menu）
sourceSets.main.java.srcDirs += 'src/optional/java'

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 17
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_17
	targetCompatibility = JavaVersion.VERSION_17
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName
	from("LICENSE") {
		rename { "${it}_$projectName"}
	}
}

publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}
	repositories {
		// Add repositories to publish to here.
	}
}