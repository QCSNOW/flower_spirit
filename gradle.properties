# ==================== Fabric 基础版本 ====================
minecraft_version=1.20.1
yarn_mappings=1.20.1+build.1
loader_version=0.15.11
loom_version=1.4.1

# ==================== 模组基础信息 ====================
mod_version=1.0.0
maven_group=com.mytest.mytestmod
mod_id=mytestmod

# ==================== 依赖版本 ====================
fabric_api_version=0.92.1+1.20.1
mod_menu_version=7.2.2
cloth_config_version=11.1.118

# ==================== 网络配置（关键！） ====================
# 超时 10 分钟，重试 1 次
# Fabric 官方源从国内访问很慢（约 2-5KB/s），给足时间确保能下完
# 下完一次进缓存后，以后构建都是秒级
systemProp.org.gradle.internal.http.connectionTimeout=600000
systemProp.org.gradle.internal.http.socketTimeout=600000
systemProp.org.gradle.internal.http.retry.max=1

# ==================== JVM & 性能 ====================
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true
org.gradle.daemon=true
org.gradle.offline=true

# ==================== 【核心】Minecraft 下载源 ====================
# Minecraft 游戏 jar、资源、版本清单 → BMCLAPI 国内镜像（满速）
loom_minecraft_base=https://bmclapi2.bangbang93.com/
loom_resources_base=https://bmclapi2.bangbang93.com/assets/
loom_version_manifests=https://bmclapi2.bangbang93.com/mc/game/version_manifest_v2.json

# ==================== 代理配置（可选，有梯子就取消注释） ====================
# systemProp.http.proxyHost=127.0.0.1
# systemProp.http.proxyPort=7890
# systemProp.https.proxyHost=127.0.0.1
# systemProp.https.proxyPort=7890
